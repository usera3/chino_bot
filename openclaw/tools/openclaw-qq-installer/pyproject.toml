[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-qq-installer"
version = "0.1.0"
description = "pip installer for the OpenClaw QQ plugin"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenClaw" }
]
dependencies = []

[project.scripts]
openclaw-qq-install = "openclaw_qq_installer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
