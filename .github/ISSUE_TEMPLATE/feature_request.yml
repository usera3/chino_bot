name: Feature request
description: Suggest an improvement or new tool.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, or tool shape you have in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent runtime
        - Memory
        - QQ / OneBot integration
        - Tooling
        - Workflow automation
        - Documentation
        - Tests
    validations:
      required: true

