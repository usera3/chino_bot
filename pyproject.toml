[tool.poetry]
name = "chino-bot"
version = "0.1.0"
description = "Agentic QQ assistant built with LangChain and NoneBot2"
authors = ["usera3"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/usera3/chino_bot"

[tool.poetry.dependencies]
python = "^3.10"
# LangChain 核心
langchain = "^0.1.0"
langchain-core = "^0.1.0"
langchain-community = "^0.0.20"
# LLM 集成
langchain-openai = "^0.0.5"
openai = "^1.0.0"
# 工具
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
# 向量数据库（可选，先不装）
# chromadb = "^0.4.22"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
ipython = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
